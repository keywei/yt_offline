name: yt_offline
description: "Offline YouTube viewer with subtitles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # JSON DTOs (hand-rolled — no codegen here)
  # NOTE: freezed removed due to analyzer 7.6.0 visitDotShorthandInvocation bug.

  # YouTube extraction
  youtube_explode_dart: ^2.3.5

  # Networking
  dio: ^5.7.0

  # Downloads (background, pause/resume, iOS background)
  background_downloader: ^8.9.5

  # Filesystem
  path_provider: ^2.1.5
  path: ^1.9.0

  # Misc
  collection: ^1.18.0
  intl: ^0.19.0

  # Player + external subtitles
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Keep CPU alive while playing so audio survives screen-off / backgrounding
  wakelock_plus: ^1.2.10

  # OS-level media controls (lock screen, notification, headset buttons,
  # CarPlay / Android Auto) PLUS Android foreground service for background
  # audio. Replaces flutter_background; works on both Android and iOS.
  audio_service: ^0.18.15

  # Persistent swipe-to-reveal actions (Dismissible is one-shot only)
  flutter_slidable: ^3.1.2

  # Read version + build number from the platform at runtime
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # build_runner/freezed/json_serializable removed (see note above).

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#04060f"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
